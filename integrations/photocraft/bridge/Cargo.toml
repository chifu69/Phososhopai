[package]
name = "photoia-photocraft-bridge"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
photocraft-engine = { git = "https://github.com/storytold/photocraft", rev = "4e7a17cd5d5723313f459753663d0d155f047e19" }
photocraft-doc = { git = "https://github.com/storytold/photocraft", rev = "4e7a17cd5d5723313f459753663d0d155f047e19" }
photocraft-compose = { git = "https://github.com/storytold/photocraft", rev = "4e7a17cd5d5723313f459753663d0d155f047e19" }
photocraft-io = { git = "https://github.com/storytold/photocraft", rev = "4e7a17cd5d5723313f459753663d0d155f047e19" }
photocraft-format = { git = "https://github.com/storytold/photocraft", rev = "4e7a17cd5d5723313f459753663d0d155f047e19" }

photocraft-geom = { git = "https://github.com/storytold/photocraft", rev = "4e7a17cd5d5723313f459753663d0d155f047e19" }

photocraft-algo = { git = "https://github.com/storytold/photocraft", rev = "4e7a17cd5d5723313f459753663d0d155f047e19" }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
